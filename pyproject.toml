[project]
name = "rift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alu-baigana-saru", email = "sahooarchana212@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "greenlet>=3.5.6",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.1.6",
    "supabase>=2.33.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rift = "rift:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
